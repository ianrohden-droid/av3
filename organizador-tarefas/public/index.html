<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Organizador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Organizador de Tarefas</h1>

  <form id="formTarefa">
    <label>Título<br><input type="text" id="titulo" required></label>
    <label>Descrição<br><textarea id="descricao"></textarea></label>
    <label>Data<br><input type="date" id="data" required></label>
    <label>Horário<br><input type="time" id="horario"></label>
    <label>Categoria<br>
      <select id="categoria" required>
        <option value="">--Escolha--</option>
        <option>Estudo</option>
        <option>Trabalho</option>
        <option>Pessoal</option>
        <option>Evento</option>
        <option>Outro</option>
      </select>
    </label>
    <label>Prioridade<br>
      <select id="prioridade" required>
        <option value="">--Escolha--</option>
        <option>Baixa</option>
        <option>Média</option>
        <option>Alta</option>
      </select>
    </label>
    <button type="submit">Adicionar Tarefa</button>
  </form>

  <div class="filtros">
    <label>Filtrar status:
      <select id="filtroStatus">
        <option value="Todas">Todas</option>
        <option value="Pendentes">Pendentes</option>
        <option value="Concluídas">Concluídas</option>
      </select>
    </label>
    <label>Filtrar categoria:
      <select id="filtroCategoria">
        <option value="Todas">Todas</option>
        <option>Estudo</option>
        <option>Trabalho</option>
        <option>Pessoal</option>
        <option>Evento</option>
        <option>Outro</option>
      </select>
    </label>
  </div>

  <div id="tarefasList"></div>

  <script src="script.js"></script>
</body>
</html>
